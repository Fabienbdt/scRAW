[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scraw"
dynamic = ["version", "dependencies"]
description = "Rare-cell-aware clustering for single-cell RNA-seq data"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Fabien Bidet" },
]
keywords = ["single-cell", "rna-seq", "clustering", "rare-cell"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "twine>=5,<7",
]

[project.scripts]
scraw = "scraw.cli:main"

[project.urls]
Repository = "https://github.com/Fabienbdt/scRAW"
Issues = "https://github.com/Fabienbdt/scRAW/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "scraw._version.__version__" }
dependencies = { file = ["requirements-portable.txt"] }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
